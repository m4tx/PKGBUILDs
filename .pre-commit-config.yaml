repos:
  - repo: https://github.com/jmelahman/pkglint
    rev: a3b3651b15d3c2b04b2548a39925643a625d5f4e # frozen: v1.6.1
    hooks:
      - id: pkglint
        args: ["--ignore", "PB906"]
      - id: pkglint-build
        # -s lets makepkg install what the package needs. It only reaches for
        # sudo when something is actually missing, so a local run with the
        # dependencies already installed never prompts; CI grants the build user
        # passwordless `sudo pacman` for the case where they are not.
        args: ["--makepkg-arg=-s"]
        # The packages below are handled by the scoped entries that follow,
        # which waive a rule that cannot be satisfied. The build refuses on
        # static findings regardless of in-file `# pkglint: ignore=`
        # directives, and built-package findings anchor to paths inside the
        # archive rather than to a line of the PKGBUILD, so neither can be
        # waived from the PKGBUILD itself.
        exclude: ^(binaryninja-free|cargo-afl|cargo-loc|fernflower-git|tundra-git)/
      # AFLplusplus is afl.rs's git submodule, so it lives under its own org.
      - id: pkglint-build
        alias: pkglint-build-submodule
        name: pkglint-build (submodule from another forge owner)
        args: ["--makepkg-arg=-s", "--ignore=PB109"]
        files: ^cargo-afl/PKGBUILD$
      # A prebuilt upstream release: its binaries' link flags cannot be changed,
      # and the bundle ships no licence text.
      - id: pkglint-build
        alias: pkglint-build-prebuilt
        name: pkglint-build (prebuilt upstream binaries)
        args: ["--makepkg-arg=-s", "--ignore=PB805,PB810,PB834"]
        files: ^binaryninja-free/PKGBUILD$
      # pkglint does not match the installed java-runtime provider against the
      # versioned `java-runtime>=8` dependency.
      - id: pkglint-build
        alias: pkglint-build-java
        name: pkglint-build (versioned java-runtime dependency)
        args: ["--makepkg-arg=-s", "--ignore=PB814"]
        files: ^fernflower-git/PKGBUILD$
      # Upstream ships no licence file, in the release or in the repository --
      # only an SPDX identifier in package metadata.
      - id: pkglint-build
        alias: pkglint-build-unlicensed
        name: pkglint-build (upstream ships no licence text)
        args: ["--makepkg-arg=-s", "--ignore=PB834"]
        files: ^cargo-loc/PKGBUILD$
      # A -git package tracking anime-relations' master branch; the file
      # changes upstream, so it cannot carry a checksum.
      - id: pkglint-build
        alias: pkglint-build-unpinned
        name: pkglint-build (tracks an unpinned upstream file)
        args: ["--makepkg-arg=-s", "--ignore=PB101"]
        files: ^tundra-git/PKGBUILD$
  # shellcheck-py rather than koalaman's own hook: that one is a docker_image
  # hook, and CI runs the hooks inside a container, where there is no docker.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # v0.11.0.1-1
    hooks:
      - id: shellcheck
        args:
          [
            "--severity=style",
            "--color=always",
            "--shell=bash",
            "--exclude=SC2034,SC2154",
          ]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce # v1.30.0
    hooks:
      - id: zizmor
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        # actionlint does not know the `$/` self-repository syntax yet:
        # https://github.com/rhysd/actionlint/issues/711
        args: ['-ignore=specifying action "\$/.*" in invalid format']
