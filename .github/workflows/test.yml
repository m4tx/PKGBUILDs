name: Tests

on:
  push:
    branches:
      - "master"
      - "pkgreleaser/*"
  pull_request:

permissions: {}

jobs:
  presubmit:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name != 'master' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # ratchet:actions/setup-python@v6
        with:
          python-version: 3.12
      - uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # ratchet:j178/prek-action@v2
        with:
          extra_args: --files $(git diff origin/master HEAD --name-only | tr '\n' ' ')
  postsubmit:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'master' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # ratchet:actions/setup-python@v6
        with:
          python-version: 3.12
      - uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # ratchet:j178/prek-action@v2
        with:
          extra_args: --files $(git diff origin/master~1 HEAD --name-only | tr '\n' ' ')
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ./shellcheck
  namcap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ./namcap
